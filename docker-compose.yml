services:
  web:
    build: .
    command: sh -c "python manage.py migrate && waitress-serve --listen=0.0.0.0:8000 webapp.wsgi:application"
    ports: ["8000:8000"]
    env_file: [.env]
    environment: ["COLLECTIP_DB_PATH=/app/data/db.sqlite3"]
    volumes: ["collectip-data:/app/data"]
    restart: unless-stopped
  worker:
    build: .
    command: python manage.py run_worker
    env_file: [.env]
    environment: ["COLLECTIP_DB_PATH=/app/data/db.sqlite3"]
    volumes: ["collectip-data:/app/data"]
    restart: unless-stopped
volumes:
  collectip-data:
